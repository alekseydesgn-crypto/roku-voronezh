    {
      "name": "zones",
      "label": "Игровые зоны и характеристики",
      "type": "file",
      "path": "content/zones.json",
      "format": "json",
      "list": true,
      "fields": [
        {
          "name": "name",
          "label": "Название",
          "type": "string",
          "required": true
        },
        {
          "name": "type",
          "label": "Категория",
          "type": "string",
          "required": true
        },
        {
          "name": "description",
          "label": "Описание",
          "type": "text",
          "required": true
        },
        {
          "name": "render",
          "label": "Это визуализация",
          "type": "boolean"
        },
        {
          "name": "images",
          "label": "Фотографии",
          "type": "image",
          "required": true,
          "options": {
            "multiple": {
              "max": 12
            },
            "unique": true
          },
          "description": "Оставьте одну фотографию, чтобы зона была статичной. Автолистание карточек отключено."
        },
        {
          "name": "specs",
          "label": "Характеристики",
          "type": "object",
          "fields": [
            {
              "name": "label",
              "label": "Параметр",
              "type": "string",
              "required": true
            },
            {
              "name": "value",
              "label": "Значение",
              "type": "string",
              "required": true
            }
          ],
          "list": {
            "min": 1,
            "max": 20
          }
        },
        {
          "name": "priceFrom",
          "label": "Стоимость за час в карточке",
          "type": "string"
        },
        {
          "name": "tariffs",
          "label": "Тарифные группы",
          "type": "object",
          "list": true,
          "fields": [
            {
              "name": "title",
              "label": "Название группы",
              "type": "string",
              "required": true
            },
            {
              "name": "rows",
              "label": "Тарифы",
              "type": "object",
              "list": true,
              "fields": [
                {
                  "name": "label",
                  "label": "Время или пакет",
                  "type": "string",
                  "required": true
                },
                {
                  "name": "value",
                  "label": "Цена",
                  "type": "string",
                  "required": true
                }
              ]
            }
          ]
        }
      ]
